name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Dependências com vulnerabilidade crítica
        run: npm audit --omit=dev --audit-level=critical

      - run: npm run build

  image:
    name: Imagem Docker
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nos containers a API sempre se chama "api", então a mesma imagem serve todos os fornecedores
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            API_PROXY_TARGET=http://api:8080
          tags: |
            ghcr.io/${{ github.repository_owner }}/consumatore:latest
            ghcr.io/${{ github.repository_owner }}/consumatore:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
